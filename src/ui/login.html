<!DOCTYPE html>
<html>
<head>
<title>Login - AWKUM Job Portal</title>
<style>
 body { font-family: Arial; background: #eef2f7; display: flex; justify-content: center; align-items: center; height: 100vh; }
 .box { background: white; padding: 30px; width: 320px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
 h2 { text-align: center; color: #1a5a9e; }
 input { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 6px; }
 button { width: 100%; padding: 11px; background: #1a5a9e; color: white; border: none; border-radius: 6px; font-weight: bold; }
 p { font-size: 12px; text-align: center; color: gray; }
</style>
</head>
<body>
<div class="box">
 <h2>AWKUM Job Portal</h2>
 <p>Login for BCS Students</p>
 <input type="email" placeholder="maimona.khurshid@awkum.edu.pk">
 <input type="password" placeholder="Password">
 <button>Login</button>
 <p>Day 2 - UI/UX Design by Maimona</p>
</div>
</body>
</html>
